<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Suite — Login</title>
    <style>
        body {
            background-color: #070711;
            color: #00d4ff;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .login-box {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid #00d4ff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        input[type="password"] {
            background: transparent;
            border: 1px solid #00d4ff;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            width: 80%;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }
        button {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #fff;
        }
        .error {
            color: #ff0055;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>SECURE CONNECTION</h2>
        <p>Terminal locked. Authentication required.</p>
        <form method="POST" action="/login">
            <div id="error-msg" class="error"></div>
            <input type="password" name="password" placeholder="Enter Password" required autofocus autocomplete="off">
            <br>
            <button type="submit">DECRYPT</button>
        </form>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-msg').innerText = "ACCESS DENIED: Invalid Password";
        }
    </script>
</body>
</html>
